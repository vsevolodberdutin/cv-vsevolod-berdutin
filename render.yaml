services:
  - type: web
    name: cv-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: yarn install && yarn build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: OPENAI_API_KEY
        sync: false
        # Set this in Render dashboard
      - key: NODE_ENV
        value: production
    autoDeploy: true
