services:
  # CV Portfolio Application
  cv-portfolio:
    build:
      context: .
      dockerfile: ./apps/cv-portfolio/Dockerfile
    container_name: cv-portfolio
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # DeFi Dashboard Application
  defi-dashboard:
    build:
      context: .
      dockerfile: ./apps/defi-dashboard/Dockerfile
    container_name: defi-dashboard
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge
    name: vsevolod-cv-network
